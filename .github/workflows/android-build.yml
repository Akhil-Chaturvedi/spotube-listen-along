name: Build Spotube (Listen Along fork) Android APK

# Cloud build so no local Flutter SDK / disk space is required.
# Produces a universal release APK as a downloadable artifact.
#
# Usage:
#   1. Push this fork to a GitHub repo.
#   2. Actions -> "Build Spotube (Listen Along fork) Android APK" -> Run workflow.
#   3. Download the `spotube-android-apk` artifact when it finishes.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master
  CHANNEL: stable
  # Minimal .env content. The build CLI writes this to .env and appends
  # RELEASE_CHANNEL. Update check is disabled to avoid extra network calls.
  DOTENV: |
    ENABLE_UPDATE_CHECK=0
    LASTFM_API_KEY=
    LASTFM_API_SECRET=
    HIDE_DONATIONS=0

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt-get clean
          df -h

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Android dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      - name: Ensure STABLE signing keystore (committed to the repo)
        # Android signature = the signing keystore. A random per-build key
        # means every APK update fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE
        # -> forced uninstall/reinstall -> ALL app data wiped (plugin blob,
        # share toggle, default plugins; device log 2026-11-26). The keystore
        # is therefore committed to the repo: the first build that doesn't
        # find it generates one and commits it; every later build reuses the
        # SAME signature, so updates install in place and preserve data.
        # (GITHUB_TOKEN pushes do not trigger new workflow runs, so the
        # auto-commit cannot recurse.)
        run: |
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "No committed keystore - generating one and committing it"
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass spotube123 -keypass spotube123 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Spotube Listen Along, OU=Dev, O=Dev, L=Dev, S=Dev, C=IN"
            git config user.name "spotube-ci"
            git config user.email "ci@users.noreply.github.com"
            git add android/app/upload-keystore.jks
            git commit -m "ci: commit stable signing keystore (ends app-data wipe on every APK update)"
            git push || (
              echo "push failed (concurrent build won the race) - reusing the keystore already committed"
              git fetch origin
              git reset --hard "origin/$GITHUB_REF_NAME"
            )
          else
            echo "Using committed keystore - APK signature stays stable across builds"
          fi
          cat > android/key.properties <<'EOF'
          storePassword=spotube123
          keyPassword=spotube123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK (armeabi-v7a only)
        run: dart cli/cli.dart build --arch=all android

      - name: Show output
        run: ls -la build/Spotube-android-armv7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spotube-android-armv7a-apk
          path: build/Spotube-android-armv7a.apk
          if-no-files-found: error

      # Publish the raw .apk to a GitHub Release so it can be downloaded
      # DIRECTLY (Actions artifacts are always delivered as a .zip; a Release
      # asset is the actual .apk file).
      - name: Publish APK to a Release (direct .apk download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: listen-along-latest
          name: "Spotube Listen Along (latest)"
          body: |
            Direct APK for the Listen Along fork (armeabi-v7a / 32-bit ARM).
            Built from commit ${{ github.sha }}.
          files: build/Spotube-android-armv7a.apk
          make_latest: true
          overwrite_files: true
